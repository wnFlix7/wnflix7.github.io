<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>wnFlix7</title><link rel="manifest" href="manifest.json">
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js')</script>
<style>
:root{--bg:#050a14;--s1:#0b1526;--s2:#122240;--pu:#1d4ed8;--pu2:#0f2a5e;--tx:#e8f0fb;--mut:#8fa6c9;--ln:#1c3050;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:12px;padding:12px 16px;background:rgba(5,10,20,.92);border-bottom:1px solid var(--ln);backdrop-filter:blur(8px)}
.logo{font-size:24px;font-weight:900;letter-spacing:-.5px;color:var(--tx)}
.logo b{color:#60a5fa}
nav{display:flex;gap:4px;margin-left:auto;overflow-x:auto}
nav button{background:none;border:0;color:var(--mut);padding:8px 10px;border-radius:8px;font:inherit;cursor:pointer;white-space:nowrap}
nav button[aria-current=true]{color:var(--tx);background:var(--s2)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #60a5fa;outline-offset:2px}
.hero{padding:56px 18px 44px;text-align:center;background:radial-gradient(ellipse 70% 80% at 50% 45%,rgba(37,99,235,.32) 0%,rgba(15,42,94,.14) 55%,#000 100%);background-color:#000;border-bottom:1px solid var(--ln)}
.hero h1{font-size:clamp(48px,17vw,96px);line-height:1;font-weight:900;letter-spacing:-2px;color:#eef6ff;text-shadow:0 0 6px #bfdbfe,0 0 18px #60a5fa,0 0 38px #2563eb,0 0 70px #1d4ed8}
.hero p{color:#bcd0ee;margin:18px auto 24px;max-width:32ch;font-size:18px}
.btn{background:var(--pu);color:#fff;border:0;border-radius:10px;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer}
.btn.sec{background:var(--s2);color:var(--tx);border:1px solid var(--ln)}
main{padding:8px 0 40px}
section{padding:18px 0 4px}
h2{font-size:19px;padding:0 16px 10px}
.row{display:flex;gap:12px;overflow-x:auto;padding:0 16px 8px;scroll-snap-type:x proximity}
.card{flex:0 0 138px;scroll-snap-align:start;background:none;border:0;padding:0;text-align:left;color:inherit;cursor:pointer}
.poster{aspect-ratio:2/3;border-radius:10px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;font-weight:800;font-size:15px;line-height:1.15;border:1px solid var(--ln);position:relative;overflow:hidden}
.poster>span{position:relative;z-index:1;text-shadow:0 1px 6px #000}.poster svg{position:absolute;inset:0;width:100%;height:100%}.poster i{z-index:1;position:absolute;top:8px;right:8px;font-style:normal;font-size:11px;background:rgba(0,0,0,.55);padding:2px 7px;border-radius:20px;color:var(--mut);font-weight:600}
.bar{height:3px;background:rgba(255,255,255,.2);margin-top:8px;border-radius:2px}
.bar span{display:block;height:100%;background:#60a5fa;border-radius:2px}
.empty{margin:18px 16px;padding:26px 18px;border:1px dashed var(--ln);border-radius:12px;color:var(--mut);text-align:center}
.empty b{display:block;color:var(--tx);font-size:17px;margin-bottom:6px}
.ov{position:fixed;inset:0;z-index:20;background:rgba(5,3,9,.9);display:none;align-items:center;justify-content:center;padding:16px}
.ov.on{display:flex}
.box{background:var(--s1);border:1px solid var(--ln);border-radius:14px;padding:18px;width:100%;max-width:440px}
.box h3{font-size:19px;margin-bottom:12px}
label{display:block;color:var(--mut);font-size:14px;margin:10px 0 4px}
input,select{width:100%;background:var(--s2);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:11px 12px;font:inherit}
.acts{display:flex;gap:8px;margin-top:16px}
.acts .btn{flex:1}
#pl{flex-direction:column;align-items:stretch;justify-content:flex-start;padding:max(12px,env(safe-area-inset-top,0px)) 12px 12px}
#pl .top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
#pl .top h3{flex:1;font-size:17px}
video{width:100%;max-height:70vh;background:#000;border-radius:10px}
#pe{color:#f0a8c0;margin-top:10px;font-size:14px}
footer{color:var(--mut);font-size:12px;text-align:center;padding:10px 20px 30px}
</style>
</head>
<body>
<header>
  <div class="logo">wn<b>Flix</b>7</div>
  <nav id="nv">
    <button data-v="all" aria-current="true">Início</button>
    <button data-v="filme" aria-current="false">Filmes</button>
    <button data-v="serie" aria-current="false">Séries</button>
  </nav>
</header>
<div class="hero">
  <h1>wnFlix7</h1>
  <p>Seu cinema, no seu bolso.</p>
  <button class="btn" id="add">Adicionar título</button>
</div>
<main id="m"></main>
<footer>Adicione apenas vídeos próprios, de domínio público ou com licença livre.</footer>

<div class="ov" id="ad"><div class="box">
  <h3>Adicionar título</h3>
  <label for="nm">Nome</label><input id="nm" placeholder="Ex.: Nosferatu (1922)">
  <label for="tp">Tipo</label><select id="tp"><option value="filme">Filme</option><option value="serie">Série</option></select>
  <label for="ur">Link do vídeo (termina em .mp4)</label><input id="ur" type="url" inputmode="url" placeholder="https://…">
  <label for="cv">Link da capa (opcional)</label><input id="cv" type="url" inputmode="url" placeholder="https://… (imagem)">
  <div class="acts"><button class="btn sec" id="cx">Cancelar</button><button class="btn" id="sv">Salvar</button></div>
</div></div>

<div class="ov" id="pl">
  <div class="top"><button class="btn sec" id="bk">Voltar</button><h3 id="pt"></h3><button class="btn sec" id="rm">Remover</button></div>
  <video id="vd" controls playsinline></video>
  <p id="pe"></p>
</div>

<script>
const $=s=>document.querySelector(s);
const rd=k=>{try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}};
const wr=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let lib=rd('wn_lib'), prog=rd('wn_prog')||{}, view='all', cur=null;
if(!lib){lib=[{id:'s1',name:'Nosferatu (1922)',type:'filme',url:'https://archive.org/download/publicmovies212/Nosferatu.mp4'},{id:'s2',name:'One Week (1920)',type:'filme',url:'https://archive.org/download/publicmovies212/One_Week.mp4'},{id:'s3',name:'D.O.A. (1949)',type:'filme',url:'https://archive.org/download/publicmovies212/D.O.A._1949.mp4'}];wr('wn_lib',lib)}
const hue=t=>{let h=0;for(const c of t)h=(h*31+c.charCodeAt(0))%60;return 205+h};
const ART={s1:`<svg viewBox='0 0 200 300' preserveAspectRatio='xMidYMid slice'><defs><linearGradient id='a1' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='#16315f'/><stop offset='1' stop-color='#03060d'/></linearGradient></defs><rect width='200' height='300' fill='url(#a1)'/><circle cx='150' cy='70' r='26' fill='#dbe7fa' opacity='.9'/><path d='M60 300 L84 150 L74 118 L88 126 L100 96 L112 126 L126 118 L116 150 L140 300Z' fill='#02040a'/><path d='M84 150 L52 214 M116 150 L150 214' stroke='#02040a' stroke-width='5' stroke-linecap='round'/></svg>`,s2:`<svg viewBox='0 0 200 300' preserveAspectRatio='xMidYMid slice'><defs><linearGradient id='a2' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='#2d62b3'/><stop offset='1' stop-color='#0a1c3a'/></linearGradient></defs><rect width='200' height='300' fill='url(#a2)'/><rect y='215' width='200' height='85' fill='#06101f'/><g transform='rotate(-8 100 190)'><rect x='62' y='150' width='76' height='62' fill='#e9f0fb'/><path d='M54 152 L100 108 L146 152Z' fill='#0f2a5e'/><rect x='92' y='178' width='16' height='34' fill='#0a1c3a'/><rect x='70' y='162' width='14' height='14' fill='#0a1c3a'/><rect x='116' y='162' width='14' height='14' fill='#0a1c3a'/></g></svg>`,s3:`<svg viewBox='0 0 200 300' preserveAspectRatio='xMidYMid slice'><rect width='200' height='300' fill='#050a14'/><g fill='#1f4d99' opacity='.45'><path d='M0 40 L200 0 L200 22 L0 62Z'/><path d='M0 90 L200 50 L200 72 L0 112Z'/><path d='M0 140 L200 100 L200 122 L0 162Z'/><path d='M0 190 L200 150 L200 172 L0 212Z'/></g><ellipse cx='100' cy='150' rx='40' ry='8' fill='#02040a'/><path d='M78 150 Q78 112 100 112 Q122 112 122 150Z' fill='#02040a'/><path d='M60 300 L72 175 L128 175 L140 300Z' fill='#02040a'/></svg>`};
function card(it){
  const h=hue(it.name),p=prog[it.id];const cov=it.cover?`<img src="${esc(it.cover)}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">`:(ART[it.id]||'');
  const pct=p&&p.d?Math.min(100,Math.round(p.t/p.d*100)):0;
  return `<button class="card" data-id="${it.id}"><div class="poster" style="background:linear-gradient(170deg,hsl(${h} 55% 28%),hsl(${h} 45% 9%))">${cov}<i>${it.type==='serie'?'Série':'Filme'}</i><span>${esc(it.name)}</span></div>${pct?`<div class="bar"><span style="width:${pct}%"></span></div>`:''}</button>`;
}
function render(){
  const sec=(t,type)=>{const l=lib.filter(x=>x.type===type);return `<section><h2>${t}</h2>${l.length?`<div class="row">${l.map(card).join('')}</div>`:`<div class="empty"><b>Nenhum ${type==='serie'?'série':'filme'} ainda</b>Toque em Adicionar título e cole o link do vídeo.</div>`}</section>`};
  const cont=lib.filter(x=>prog[x.id]&&prog[x.id].t>5);
  let h='';
  if(view==='all'&&cont.length) h+=`<section><h2>Continuar assistindo</h2><div class="row">${cont.map(card).join('')}</div></section>`;
  if(view!=='serie') h+=sec('Filmes','filme');
  if(view!=='filme') h+=sec('Séries','serie');
  $('#m').innerHTML=h;
}
$('#nv').onclick=e=>{const b=e.target.closest('button');if(!b)return;view=b.dataset.v;document.querySelectorAll('#nv button').forEach(x=>x.setAttribute('aria-current',x===b));render()};
$('#add').onclick=()=>$('#ad').classList.add('on');
$('#cx').onclick=()=>$('#ad').classList.remove('on');
$('#sv').onclick=()=>{
  const name=$('#nm').value.trim(),url=$('#ur').value.trim();
  if(!name||!/^https?:\/\//.test(url)){alert('Preencha o nome e um link que comece com https://');return}
  lib.push({id:Date.now().toString(36),name,type:$('#tp').value,url,cover:$('#cv').value.trim()});
  wr('wn_lib',lib);$('#nm').value='';$('#ur').value='';$('#cv').value='';$('#ad').classList.remove('on');render();
};
$('#m').onclick=e=>{
  const c=e.target.closest('.card');if(!c)return;
  cur=lib.find(x=>x.id===c.dataset.id);if(!cur)return;
  const v=$('#vd');$('#pt').textContent=cur.name;$('#pe').textContent='';
  v.src=cur.url;$('#pl').classList.add('on');
  v.onloadedmetadata=()=>{const p=prog[cur.id];if(p&&p.t>5&&p.t<v.duration-10)v.currentTime=p.t};
  v.onerror=()=>{$('#pe').innerHTML='Não foi possível tocar aqui dentro. <a href="'+esc(cur.url)+'" target="_blank" rel="noopener" style="color:#93c5fd">Abrir o filme em outra aba</a>.'};
  v.play().catch(()=>{});
};
$('#vd').ontimeupdate=()=>{const v=$('#vd');if(cur&&v.duration){prog[cur.id]={t:v.currentTime,d:v.duration};wr('wn_prog',prog)}};
const stop=()=>{const v=$('#vd');v.pause();v.removeAttribute('src');v.load();$('#pl').classList.remove('on');render()};
$('#bk').onclick=stop;
$('#rm').onclick=()=>{if(!cur||!confirm('Remover “'+cur.name+'” da biblioteca?'))return;lib=lib.filter(x=>x.id!==cur.id);delete prog[cur.id];wr('wn_lib',lib);wr('wn_prog',prog);stop()};
render();
</script>
</body>
</html>
